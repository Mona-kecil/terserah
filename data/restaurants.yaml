# The pool the system agent proposes from.
#
# REAL Jakarta places, seeded as a starting point. Two caveats you must respect:
#
#   1. PRICES ARE ESTIMATES. Jakarta menus move. Verify before a real round.
#   2. HALAL / PORK TAGS ARE BEST-EFFORT, NOT CERTIFIED.
#
# The tagging rule used here: when unsure whether a place serves pork, tag it
# `pork` anyway - blocking a halal person from a pork kitchen is the safe error.
# When unsure whether a place is genuinely halal, do NOT tag `halal`, so nobody
# gets false assurance from it.
#
# Verify anything that matters. A wrong allergen tag is the one bug in this
# project that can actually hurt someone.
#
#   python places.py list
#   python places.py tags
#   python places.py import data/places.csv     # bulk add
#   python places.py remove "Name"

